version: "3.8"
services:
  backend:
    build:
      context: ./backend
    environment:
      - PORT=3001
      - CLIENT_URL=${CLIENT_URL:-http://localhost:5173}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
    ports:
      - "3001:3001"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3001}
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
